# Tests to skip in the testsuite runner
# Format: filename reason
# Lines starting with # are comments, blank lines are ignored.

# GC/ephemeron tests (no GC implementation)
ephetest.ml         ephemeron weak references (requires GC)
ephetest2.ml        ephemeron (requires GC, times out)
ephetest2_new.ml    ephemeron (requires GC, times out)
ephetest3.ml        ephemeron stats (requires GC)
ephetest_new.ml     ephemeron weak references (requires GC)
ephe_infix.ml       ephemeron infix (requires GC)
ephe_infix_new.ml   ephemeron infix (requires GC)
ephe_issue9391.ml   ephemeron issue (requires GC)
gcwords.ml          GC word counting (requires GC)
weaklifetime.ml     weak reference lifetime (requires GC)
weaklifetime2.ml    weak reference lifetime (requires GC, times out)
weaktest.ml         weak reference tests (requires GC, times out)
finaliser.ml        GC finaliser (requires GC)

# Stdin-dependent tests (block forever waiting for input)
wc.ml               reads from stdin when no arguments passed

# Step limit / timeout
fib.ml              exceeds interpreter step limit
